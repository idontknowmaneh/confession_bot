<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confession Submitted</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        body {
          font-family: 'Inter', sans-serif;
          background-color: #121212; /* Dark background */
          color: #E0E0E0; /* Light text color */
          text-align: center;
        }
        .container {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100vh;
        }
        .formbold-main-wrapper {
          background: #1E1E1E; /* Dark form background */
          padding: 40px;
          border-radius: 8px;
        }
        .formbold-form-input {
          width: 100%;
          padding: 13px 22px;
          border-radius: 5px;
          border: 1px solid #333; /* Dark border for input */
          background: #333; /* Dark input background */
          font-weight: 500;
          font-size: 16px;
          color: #E0E0E0; /* Light text in inputs */
          outline: none;
        }
        .formbold-btn {
          font-size: 16px;
          border-radius: 5px;
          padding: 14px 25px;
          background-color: #6a64f1;
          color: white;
          cursor: pointer;
          margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="formbold-main-wrapper">
            <h2>Your Confession Has Been Submitted!</h2>
            <p style="margin-bottom: 20px;">Your unique confession ID is:</p>
            <input type="text" class="formbold-form-input" value="{{ unique_id }}" readonly />
            <button class="formbold-btn" onclick="copyToClipboard()">Copy ID</button>
        </div>
    </div>

    <script>
        function copyToClipboard() {
            const copyText = document.querySelector('input');
            copyText.select();
            copyText.setSelectionRange(0, 99999); // For mobile devices
            document.execCommand("copy");
            alert("Copied the ID: " + copyText.value);
        }
    </script>
</body>
</html>
